<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Response Dashboard — Concrete Memories</title>
    <link rel="stylesheet" href="dashboard.css?v=20261102-complete-only" />
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div><h1>Concrete Memories Response</h1></div>
        <div class="dashboard-actions">
          <button id="dashboard-logout" type="button" hidden>Sign out</button>
        </div>
      </header>

      <p class="dashboard-status" id="dashboard-status" role="status"></p>

      <section class="dashboard-login" id="dashboard-login" aria-labelledby="login-title" hidden>
        <p class="eyebrow">Private dashboard</p>
        <h2 id="login-title">Sign in to view responses</h2>
        <p>Use the project-member account. Participants do not need an account.</p>
        <form id="login-form">
          <label>Email<input name="email" type="email" autocomplete="username" required /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Sign in</button>
        </form>
      </section>

      <div id="dashboard-content" hidden>

      <section class="decision-panel" aria-labelledby="decision-title">
        <div class="section-heading"><div><p class="eyebrow">Final decision</p><h2 id="decision-title">What participants chose</h2></div><span id="decision-caption"></span></div>
        <div class="decision-bar" aria-hidden="true"><span id="buy-bar"></span><span id="pass-bar"></span></div>
        <div class="decision-key"><span><i class="buy-dot"></i>Buy</span><span><i class="pass-dot"></i>Do not buy</span></div>
      </section>

      <section aria-labelledby="responses-title">
        <div class="section-heading"><div><p class="eyebrow">Individual journeys</p><h2 id="responses-title">Participant responses</h2></div></div>
        <p class="empty-state" id="empty-state">No responses have been recorded in this browser yet.</p>
        <div class="response-list" id="response-list"></div>
      </section>
      </div>
    </main>
    <template id="response-template">
      <article class="response-card">
        <header><div><h3 class="response-name"></h3><p class="response-meta"></p></div></header>
        <div class="response-grid">
          <section><h4>Final choice</h4><p class="response-choice"></p></section>
          <section><h4>Notebook</h4><p class="response-notebook-count"></p><ul class="tag-list response-notebook"></ul></section>
          <section class="response-comment-section"><h4>Comment</h4><blockquote class="response-comment"></blockquote></section>
          <details><summary>Activity journey</summary><ol class="activity-list"></ol></details>
        </div>
      </article>
    </template>
    <script src="supabase-config.js?v=20261102-supabase"></script>
    <script src="participant-data.js?v=20261102-supabase"></script>
    <script src="dashboard.js?v=20261102-complete-only"></script>
  </body>
</html>
