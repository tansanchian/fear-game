<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#172923" />
  <title>Back to the Lift — Concrete Memories</title>
  <link rel="stylesheet" href="memory-return.css?v=20261102-clean-copy" />
</head>
<body>
  <main id="return-walk" aria-label="Walk back to the lift">
    <img id="return-backdrop" src="assets/stop-01.jpg" alt="" />
    <div class="return-view" id="return-view">
      <img id="return-photo" src="assets/stop-01.jpg" alt="The familiar corridor" />
      <img id="return-glimpse" alt="" aria-hidden="true" />
    </div>
    <div class="return-shade" aria-hidden="true"></div>
    <section class="return-story" aria-labelledby="return-title">
      <h1 id="return-title">You put your phone away</h1>
      <p id="return-copy">The comments leave you picturing the flat as it used to be. Then the thought spreads to the rest of the block: shut doors, an empty corridor. You decide to head back to the lift and clear your head.</p>
      <button id="return-step" type="button" disabled>← Back towards the lift</button>
      <p id="return-error" role="alert" hidden>This view could not load. Please try again.</p>
    </section>
    <p class="sr-only" id="return-announcement" role="status" aria-live="polite"></p>
  </main>
  <script src="supabase-config.js?v=20261102-supabase"></script>
  <script src="participant-data.js?v=20261102-supabase"></script>
  <script>ParticipantData.page('memory-return.html');</script>
  <script src="memory-journey.js?v=20261102-plain-ui"></script>
  <script src="memory-return.js?v=20261102-clean-copy"></script>
</body>
</html>
